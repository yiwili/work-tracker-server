services:
  db:
    image: postgres:17-alpine
    container_name: wts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: work_tracker
      POSTGRES_USER: wts_user
      POSTGRES_PASSWORD: ${WTS_DB_PASSWORD:-wts_secret_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wts_user -d work_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_connections=40
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c effective_cache_size=384MB

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: wts-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WTS_HTTP_ADDR: ":8080"
      WTS_DATABASE_URL: "postgres://wts_user:${WTS_DB_PASSWORD:-wts_secret_password}@db:5432/work_tracker?sslmode=disable"
      WTS_DB_MAX_CONNS: "8"
      WTS_ALLOW_REGISTRATION: "${WTS_ALLOW_REGISTRATION:-true}"
      WTS_CLOUD_PUBLISH_ENABLED: "${WTS_CLOUD_PUBLISH_ENABLED:-false}"
      WTS_BCRYPT_COST: "12"
      WTS_LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
